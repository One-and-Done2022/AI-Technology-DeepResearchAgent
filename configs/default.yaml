# AI Technology Research Agent — production/default configuration

# Connection details and API keys belong in .env.local.
model:
  backend: "qwen"
  backend_sampling:
    qwen:
      temperature: 0.2
      max_tokens: 4096
      top_p: 1.0
    deepseek:
      temperature: 0.5
      max_tokens: 4096
      top_p: 1.0
    modules:
      planner:
        temperature: 0.2
        max_tokens: 4096
      solver:
        temperature: 0.5
        max_tokens: 4096
      summarizer:
        temperature: 0.3
        max_tokens: 8192
  backend_mapping:
    planner: "qwen"
    solver: "qwen"
    summarizer: "qwen"

orchestrator:
  max_concurrent: 5
  global_timeout_seconds: 600
  max_replan_rounds: 2

research:
  enabled: true
  max_rounds: 2
  min_sources_per_task: 2
  max_followup_tasks: 3
  max_tool_calls: 6

evidence:
  enabled: true
  verification_enabled: true
  db_path: "data/evidence.db"
  support_threshold: 0.22
  partial_threshold: 0.08

quality_control:
  adversarial_enabled: true
  adversarial_backend: deterministic
  adversarial_max_tokens: 2048
  compression_enabled: true
  memory_enabled: true
  compression_target_ratio: 0.65
  max_adversarial_rounds: 2

tools:
  mock_mode: false
  github_timeout_seconds: 20
