# Local smoke configuration. Start vLLM on 127.0.0.1:8000 first.

model:
  backend: "vllm"
  backend_sampling:
    vllm:
      temperature: 0.2
      max_tokens: 768
      top_p: 1.0
    modules:
      planner:
        temperature: 0.1
        max_tokens: 768
      solver:
        temperature: 0.2
        max_tokens: 768
      summarizer:
        temperature: 0.2
        max_tokens: 1024
  backend_mapping:
    planner: "vllm"
    solver: "vllm"
    summarizer: "vllm"

orchestrator:
  max_concurrent: 2
  global_timeout_seconds: 300
  max_replan_rounds: 1

research:
  enabled: true
  max_rounds: 2
  min_sources_per_task: 1
  max_followup_tasks: 2
  max_tool_calls: 4

evidence:
  enabled: true
  db_path: "outputs/smoke/evidence.db"
  support_threshold: 0.22
  partial_threshold: 0.08

tools:
  mock_mode: true
  github_timeout_seconds: 5
