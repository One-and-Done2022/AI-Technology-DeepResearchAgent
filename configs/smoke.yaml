# Local end-to-end smoke configuration.
# Start an OpenAI-compatible vLLM server on 127.0.0.1:8000 before use.

system:
  name: "DeepResearchAgent"
  version: "0.1.0-smoke"
  log_level: "INFO"
  work_dir: "./outputs/smoke"

model:
  backend: "vllm"
  backend_sampling:
    vllm:
      temperature: 0.2
      max_tokens: 768
      top_p: 1.0
    modules:
      planner:
        temperature: 0.1
        max_tokens: 768
      solver:
        temperature: 0.2
        max_tokens: 768
      summarizer:
        temperature: 0.2
        max_tokens: 1024
      red_agent:
        temperature: 0.1
        max_tokens: 256
      blue_agent:
        temperature: 0.1
        max_tokens: 256
      judge:
        temperature: 0.1
        max_tokens: 256
      compressor:
        temperature: 0.1
        max_tokens: 512
  backend_mapping:
    solver: "vllm"
    planner: "vllm"
    summarizer: "vllm"
    judge: "vllm"
    red_agent: "vllm"
    blue_agent: "vllm"
    compressor: "vllm"

orchestrator:
  max_concurrent: 2
  global_timeout_seconds: 300
  max_replan_rounds: 1
  max_sub_questions: 8
  max_subagent_retries: 1

planner:
  max_search_rounds_per_subagent: 2
  enable_replan: true
  enable_completeness_check: true

compressor:
  max_context_length: 6000
  output_reserve_tokens: 1024
  l1_threshold: 0.6
  l2_threshold: 0.8
  l3_threshold: 0.95
  embedding_model: "all-MiniLM-L6-v2"
  enable_multilevel: true

memory:
  db_path: "outputs/smoke/memory.db"
  max_entries: 1000
  similarity_threshold_dup: 0.92
  similarity_threshold_conflict: 0.65
  evict_interval: 100
  enable_vector_index: true

adversarial:
  enabled: true
  max_rounds: 1
  max_issues_per_round: 2
  score_threshold: 8.0
  delta_threshold: 0.3
  save_logs: true

evolution:
  enabled: false

tools:
  web_search:
    enabled: true
    mock_mode: true
    max_results: 3
    snippet_max_tokens: 256
  arxiv_reader:
    enabled: true
    max_papers: 2
    abstract_max_tokens: 512
  code_sandbox:
    enabled: false
    timeout_seconds: 10
    memory_limit_mb: 256
