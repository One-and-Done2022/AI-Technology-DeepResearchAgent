[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-technology-research-agent"
version = "0.2.0"
description = "面向人工智能、软件系统与开源生态的证据驱动研究 Agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Independent Developer"},
]
keywords = ["deep-research", "technology-intelligence", "evidence-grounding", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # 核心依赖
    "openai>=1.0",
    "aiohttp>=3.8",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# vLLM 推理服务依赖
serve = [
    "vllm>=0.4.0",
]
# 开发依赖
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]
# 全部可选依赖
all = [
    "ai-technology-research-agent[serve,dev]",
]

[project.scripts]
# 命令行快捷入口
run-research = "scripts.run_single:main"
run-tech-benchmark = "scripts.run_tech_benchmark:main"

[project.urls]
Homepage = "https://github.com/One-and-Done2022/AI-Technology-DeepResearchAgent"
Repository = "https://github.com/One-and-Done2022/AI-Technology-DeepResearchAgent"
Issues = "https://github.com/One-and-Done2022/AI-Technology-DeepResearchAgent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evaluation*", "scripts*"]
exclude = ["tests*", "outputs*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
